<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#f59e0b"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Lumina"/>
<meta name="description" content="CRM · Lumina Asesoría Energética"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Lumina · CRM</title>
<script>
window.__ip=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__ip=e;var b=document.getElementById('iBar');if(b)b.style.display='flex';});
window.addEventListener('appinstalled',function(){window.__ip=null;var b=document.getElementById('iBar');if(b)b.style.display='none';});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --am:#f59e0b;--am2:#d97706;--dk:#1e293b;--lt:#fffbeb;
  --gr:#16a34a;--re:#dc2626;--ax:#3b82f6;--pu:#7c3aed;--te:#0891b2;
  --bg:#f8fafc;--sf:#fff;--bd:#e2e8f0;--bd2:#cbd5e1;
  --t1:#1e293b;--t2:#475569;--t3:#94a3b8;
  --r:8px;--r2:10px;--sh:0 1px 3px rgba(0,0,0,.07);--sh2:0 4px 16px rgba(0,0,0,.1);
}
html,body{height:100%;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:var(--t1);overflow:hidden}
body{display:flex;flex-direction:column}

/* ── NAV ── */
nav{background:var(--dk);padding:0 16px;display:flex;align-items:center;gap:0;flex-shrink:0;height:52px;position:relative;z-index:50}
.nav-logo{height:32px;width:auto;margin-right:16px;flex-shrink:0;object-fit:contain}
.nav-tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nt{padding:0 14px;height:52px;border:none;background:transparent;font-size:13px;font-weight:500;color:#94a3b8;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;transition:all .15s;position:relative}
.nt.on{color:var(--am);border-bottom-color:var(--am)}
.nt:hover{color:#e2e8f0}
.nt .nb{position:absolute;top:8px;right:6px;background:var(--re);color:#fff;border-radius:8px;font-size:9px;font-weight:700;padding:1px 4px;min-width:13px;text-align:center}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.sync-lbl{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.sync-ok{background:rgba(22,163,74,.2);color:#4ade80}
.sync-off{background:rgba(251,191,36,.15);color:#fbbf24}
.sync-err{background:rgba(220,38,38,.2);color:#f87171}
.nav-search-btn{width:32px;height:32px;border:none;background:rgba(255,255,255,.1);border-radius:var(--r);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:#94a3b8}
.nav-search-btn:hover{background:rgba(255,255,255,.18);color:#fff}

/* ── INSTALL BAR ── */
#iBar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--dk);color:#fff;padding:10px 16px;z-index:200;align-items:center;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.3);border-top:1px solid #334155}
#iBar img{width:34px;height:34px;border-radius:7px;flex-shrink:0}
#iBar .ib-txt{flex:1}
#iBar .ib-nm{font-size:13px;font-weight:700}
#iBar .ib-sub{font-size:11px;color:#94a3b8}
.ib-btn{height:34px;padding:0 16px;background:var(--am);color:var(--dk);border:none;border-radius:var(--r);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.ib-x{background:transparent;border:none;color:#64748b;font-size:20px;cursor:pointer;padding:0 4px;line-height:1}

/* ── GLOBAL SEARCH OVERLAY ── */
.gs-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;padding:16px;backdrop-filter:blur(2px)}
.gs-ov.on{display:flex;flex-direction:column;align-items:center;gap:0}
.gs-box{background:var(--sf);border-radius:var(--r2);width:100%;max-width:600px;overflow:hidden;box-shadow:var(--sh2)}
.gs-inp-wrap{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--bd);gap:10px}
.gs-inp-wrap span{font-size:18px;color:var(--t3)}
.gs-inp{flex:1;height:48px;border:none;font-size:15px;font-family:inherit;color:var(--t1);outline:none;background:transparent}
.gs-close{border:none;background:none;cursor:pointer;color:var(--t3);font-size:22px;padding:0 4px}
.gs-results{max-height:60vh;overflow-y:auto;padding:8px}
.gs-section{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px}
.gs-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;transition:background .1s}
.gs-item:hover{background:var(--bg)}
.gs-item .gi-ic{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.gs-item .gi-main{flex:1;min-width:0}
.gs-item .gi-nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-item .gi-sub{font-size:11px;color:var(--t3);margin-top:1px}
.gs-empty{padding:32px;text-align:center;color:var(--t3);font-size:13px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--sh)}
.stat .sv{font-size:22px;font-weight:700;line-height:1}
.stat .sl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:600}

/* ── TOOLBAR ── */
.bar{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:9px 12px;margin-bottom:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.bar input,.bar select{height:30px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--t1);background:var(--sf);outline:none;transition:border .12s}
.bar input:focus,.bar select:focus{border-color:var(--am)}
.bar input[type=search],.bar input[type=text]{flex:1;min-width:140px}
.bar input[type=date]{width:140px}
.bar-end{margin-left:auto;font-size:12px;color:var(--t3);white-space:nowrap}
.chip{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t3);transition:all .12s;font-family:inherit;white-space:nowrap}
.chip:hover{color:var(--t2);border-color:var(--bd2)}
.chip.on{background:#fffbeb;color:#92400e;border-color:var(--am);font-weight:600}

/* ── VISIT CARDS ── */
.vc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:8px;overflow:hidden;transition:border-color .12s;box-shadow:var(--sh)}
.vc:hover{border-color:var(--bd2)}
.vc.open{border-color:var(--am)}
.vc-h{display:flex;align-items:center;padding:11px 14px;gap:11px;cursor:pointer;user-select:none}
.vc-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0}
.vc-time{min-width:42px;text-align:center;font-size:13px;font-weight:700;color:var(--t1)}
.vc-hm{font-size:9px;color:var(--t3);text-transform:uppercase}
.vc-info{flex:1;min-width:0}
.vc-nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vc-sub{font-size:12px;color:var(--t2);margin-top:2px}
.vc-body{border-top:1px solid var(--bd);padding:11px 14px;background:var(--bg)}
.vc-note{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);padding:8px 11px;font-size:13px;color:#78350f;margin-bottom:10px;line-height:1.5}
.vc-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t3);transition:all .12s;font-family:inherit}
.sp:hover{border-color:var(--am);color:#92400e}
.sp.on{background:#fffbeb;color:#92400e;border-color:var(--am)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-am{background:#fffbeb;color:#92400e}
.b-gr{background:#f0fdf4;color:#166534}
.b-ax{background:#eff6ff;color:#1d4ed8}
.b-re{background:#fef2f2;color:#991b1b}
.b-pu{background:#faf5ff;color:#6d28d9}
.b-gy{background:var(--bg);color:var(--t2);border:1px solid var(--bd)}
.b-te{background:#ecfeff;color:#0e7490}

/* ── CLIENTS ── */
.cl{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;transition:all .12s;box-shadow:var(--sh)}
.cl:hover{border-color:var(--bd2);box-shadow:var(--sh2)}
.cl-av{width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.cl-nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-sub{font-size:12px;color:var(--t2);margin-top:2px}
.cl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-info{background:var(--bg);color:var(--t2);font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--bd)}
.cs-nunca{background:#fef3c7;color:#92400e}
.cs-intentado{background:#fee2e2;color:#991b1b}
.cs-seguimiento{background:#dbeafe;color:#1e40af}
.cs-activo{background:#dcfce7;color:#166534}
.cs-inactivo{background:var(--bg);color:var(--t3)}

/* ── CLIENT DETAIL ── */
.cl-detail{background:var(--sf);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh2)}
.cl-detail-hero{background:linear-gradient(135deg,#1e293b,#334155);padding:20px;color:#fff;display:flex;align-items:center;gap:14px}
.cl-detail-av{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0}
.cl-detail-body{padding:16px}
.cl-detail-section{font-size:11px;font-weight:700;color:var(--am);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.cl-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.cl-detail-field{background:var(--bg);border-radius:var(--r);padding:9px 12px}
.cl-detail-field .lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:3px}
.cl-detail-field .val{font-size:13px;font-weight:500;color:var(--t1)}
.cl-detail-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--bd);background:var(--bg)}
.hist-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* ── PIPELINE ── */
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kan::-webkit-scrollbar{height:4px}
.kan::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.kcol{min-width:182px;width:182px;flex-shrink:0;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);padding:10px}
.kcol-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kcol-lbl{font-size:11px;font-weight:700}
.kcol-ct{font-size:10px;color:var(--t3)}
.opp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 11px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.opp:hover{border-color:var(--am);box-shadow:var(--sh)}
.opp-nm{font-size:12px;font-weight:600}
.opp-sub{font-size:10px;color:var(--t3);margin:2px 0 5px}
.opp-val{font-size:13px;font-weight:700;color:var(--am)}
.prob-bar{height:3px;background:var(--bd);border-radius:2px;margin:5px 0 2px;overflow:hidden}
.prob-fill{height:100%;border-radius:2px}

/* ── PARTE ── */
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:14px;box-shadow:var(--sh)}
.pcard-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);margin-bottom:10px}
.pf{margin-bottom:10px}
.pf label{display:block;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.pf textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r);font-family:inherit;font-size:13px;resize:vertical;min-height:60px;outline:none;background:var(--bg);color:var(--t1)}
.pf textarea:focus{border-color:var(--am)}
.mood{display:flex;gap:6px}
.mood button{flex:1;padding:7px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:20px;cursor:pointer;background:var(--sf);transition:all .12s}
.mood button:hover{transform:scale(1.06)}
.mood button.on{border-color:var(--am);background:var(--lt)}
.tarea{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:5px;background:var(--sf)}
.tarea.done .tx{text-decoration:line-through;color:var(--t3)}
.tx{flex:1;font-size:13px}
.tdel{border:none;background:none;cursor:pointer;color:var(--t3);font-size:17px;padding:0 2px}
.tdel:hover{color:var(--re)}
.tadd{display:flex;gap:6px;margin-top:6px}
.tadd input{flex:1;padding:7px 10px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg);color:var(--t1);font-family:inherit;font-size:13px;outline:none}
.tadd input:focus{border-color:var(--am)}
.tl-i{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--bd);position:relative}
.tl-i:last-child{border-bottom:none}
.tl-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd2);background:var(--sf);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px}
.tl-tx{flex:1}
.tl-nm{font-size:13px;font-weight:500}
.tl-mt{font-size:11px;color:var(--t3)}

/* ── ALERTAS ── */
.al{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.al.done{opacity:.5}
.aldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.al-info{flex:1;min-width:0}
.al-msg{font-size:13px;font-weight:500}
.al-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--bd2);background:var(--sf);color:var(--t1);transition:all .12s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn:active{transform:scale(.97)}
.btn-sm{height:26px;padding:0 10px;font-size:12px}
.btn-am{background:var(--am);color:var(--dk);border-color:var(--am)}.btn-am:hover{background:var(--am2)}
.btn-re{background:#fef2f2;color:var(--re);border-color:#fca5a5}
.btn-gr{background:#f0fdf4;color:var(--gr);border-color:#86efac}
.btn-gh{background:transparent;border-color:transparent;color:var(--t2)}.btn-gh:hover{background:var(--bg)}
.add{height:30px;padding:0 14px;background:var(--am);color:var(--dk);border:none;border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.add:hover{background:var(--am2)}.add:active{transform:scale(.97)}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:400;backdrop-filter:blur(2px);padding:0}
@media(min-width:600px){.ov{align-items:center;padding:20px}}
.modal{background:var(--sf);border-radius:var(--r2) var(--r2) 0 0;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -4px 32px rgba(0,0,0,.15)}
@media(min-width:600px){.modal{border-radius:var(--r2)}}
.mhandle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.mh{padding:13px 16px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mh h3{font-size:15px;font-weight:700}
.mx{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2)}
.mx:hover{background:var(--bd)}
.mb{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.mb::-webkit-scrollbar{width:4px}
.mb::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end;flex-shrink:0;background:var(--bg)}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.fi input,.fi select,.fi textarea{border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:inherit;color:var(--t1);background:var(--sf);outline:none;transition:border .12s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--am)}
.fi textarea{resize:vertical;min-height:65px;line-height:1.5}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fsec{font-size:10px;font-weight:700;color:var(--am);text-transform:uppercase;letter-spacing:.5px;padding:4px 0;border-bottom:1px solid var(--bd)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:16px;background:var(--dk);color:#fff;padding:10px 14px;border-radius:var(--r);font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;box-shadow:var(--sh2);max-width:300px;border-left:3px solid var(--am);z-index:500}
.toast.show{opacity:1;transform:none}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.eic{font-size:36px;margin-bottom:10px}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  .pg2{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr}
  .cl-detail-grid{grid-template-columns:1fr}
  .content{padding:10px 12px}
}
</style>
</head>
<body>

<!-- INSTALL BAR -->
<div id="iBar">
  <img src="icon-192.png" alt="Lumina"/>
  <div class="ib-txt"><div class="ib-nm">Lumina CRM</div><div class="ib-sub">Instalar como app</div></div>
  <button class="ib-btn" onclick="doInstall()">Instalar</button>
  <button class="ib-x" onclick="document.getElementById('iBar').style.display='none'">✕</button>
</div>

<!-- GLOBAL SEARCH -->
<div class="gs-ov" id="gsOv" onclick="if(event.target.id==='gsOv')closeGS()">
  <div class="gs-box">
    <div class="gs-inp-wrap">
      <span>🔍</span>
      <input class="gs-inp" id="gsInp" placeholder="Buscar clientes, visitas, oportunidades..." oninput="doGS(this.value)"/>
      <button class="gs-close" onclick="closeGS()">✕</button>
    </div>
    <div id="gsRes" class="gs-results"><div class="gs-empty">Escribe para buscar...</div></div>
  </div>
</div>

const NS     = 'lumina1';
const TODAY  = new Date().toISOString().split('T')[0];
const SB_URL = 'https://wiwurbrvhspyarbaxdhr.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd3VyYnJ2aHNweWFyYmF4ZGhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODM5MDMsImV4cCI6MjEwMDc1OTkwM30.f4Tq0IZxAS5P-m2rYFRav5saF-KfFtt6bb1yGkbDS1M';

// ── STATE ──
let V=[], C=[], O=[], AL=[], PA={};
let tab='agenda', xId=null;
let fDate=TODAY, fEst='Todos', fTip='Todos', fQ='';
let cQ='', cFil='todos', cDetail=null;

// ── UTILS ──
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmtD = iso => { if(!iso)return''; const[y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtE = n => `€${Number(n||0).toLocaleString('es-ES')}`;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const g = id => { const e=document.getElementById(id); return e?e.value.trim():''; };
let _toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('show'),2800);
}
function setSB(s) {
  const el=document.getElementById('syncLbl'); if(!el) return;
  const m={ok:['✓ Sincronizado','sync-ok'],off:['◌ Sin conexión','sync-off'],saving:['↻ Guardando','sync-off'],err:['⚠ Reintentando','sync-err']};
  const [txt,cls]=m[s]||m.off;
  el.textContent=txt; el.className='sync-lbl '+cls;
}

// ── SUPABASE ──
async function sb(method,table,body,qs='') {
  const r = await fetch(SB_URL+'/rest/v1/'+table+qs, {
    method,
    headers: {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',
      'Prefer': method==='POST'?'resolution=merge-duplicates,return=minimal':'return=minimal'},
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error(await r.text());
  return method==='GET' ? r.json() : true;
}
async function sbR(method,table,body,qs='',tries=3) {
  for(let i=0;i<tries;i++) {
    try { return await sb(method,table,body,qs); }
    catch(e) { if(i===tries-1) throw e; await new Promise(r=>setTimeout(r,800*(i+1))); }
  }
}

// ── STORAGE ──
function saveLocal() {
  try {
    localStorage.setItem(NS, JSON.stringify({V,C,O,AL,PA,ts:Date.now()}));
    return true;
  } catch(e) { toast('❌ Error local: '+e.message); return false; }
}
function loadLocal() {
  try {
    const raw=localStorage.getItem(NS);
    if(raw) { const d=JSON.parse(raw); V=d.V||[]; C=d.C||[]; O=d.O||[]; AL=d.AL||[]; PA=d.PA||{}; return true; }
  } catch(e) {}
  return false;
}

async function saveCloud() {
  if(_saving) return; _saving=true;
  setSB('saving');
  try {
    const rv=V.map(v=>(({id:v.id,cliente:v.cliente||'',contacto:v.contacto||'',telefono:v.telefono||'',fecha:v.fecha||'',hora:v.hora||'',tipo:v.tipo||'',estado:v.estado||'',notas:v.notas||''})));
    const rc=C.map(c=>(({id:c.id,empresa:c.empresa||'',nif:c.nif||'',contacto:c.contacto||'',cargo:c.cargo||'',telefono:c.telefono||'',email:c.email||'',sector:c.sector||'',ciudad:c.ciudad||'',estado:c.estado||'nunca',origen:c.origen||'',cups:c.cups||'',direccion:c.direccion||'',compania:c.compania||'',energia:c.energia||'',tarifa:c.tarifa||'',kw:c.kw||0,kwh:c.kwh||0,importe:c.importe||0,notas:c.notas||''})));
    const ro=O.map(o=>(({id:o.id,cliente:o.cliente||'',contacto:o.contacto||'',valor:o.valor||0,prob:o.prob||50,etapa:o.etapa||'',tipo:o.tipo||'',fecha:o.fecha||'',notas:o.notas||''})));
    const ra=AL.map(a=>(({id:a.id,msg:a.msg||'',tipo:a.tipo||'',fecha:a.fecha||'',hora:a.hora||'',cliente:a.cliente||'',activa:a.activa!==false})));
    const rp=Object.entries(PA).map(([fecha,p])=>(({fecha,obj:p.obj||'',log:p.log||'',dif:p.dif||'',prox:p.prox||'',mood:p.mood||'',tareas:p.tareas||[]})));
    await Promise.all([
      rv.length?sbR('POST','visitas',rv,'?on_conflict=id'):null,
      rc.length?sbR('POST','clientes',rc,'?on_conflict=id'):null,
      ro.length?sbR('POST','oportunidades',ro,'?on_conflict=id'):null,
      ra.length?sbR('POST','alertas',ra,'?on_conflict=id'):null,
      rp.length?sbR('POST','partes',rp,'?on_conflict=fecha'):null,
    ].filter(Boolean));
    setSB('ok'); _queue=false;
  } catch(e) { setSB('err'); _queue=true; console.warn('Cloud save:',e.message); }
  finally { _saving=false; }
}

async function save() {
  if(!saveLocal()) return;
  badges();
  if(!navigator.onLine) { setSB('off'); _queue=true; return; }
  saveCloud();
}

async function load() {
  // 1. Carga local INMEDIATA — sin esperar nada
  setSB('off');
  if(!loadLocal()) { seed(); }
  badges();
  render();

  // 2. Nube en segundo plano — sin bloquear UI
  setTimeout(async () => {
    if(!navigator.onLine) { setSB('off'); return; }
    setSB('saving');
    try {
      const [cv,cc,co,ca,cp] = await Promise.all([
        sb('GET','visitas',null,'?select=*'),
        sb('GET','clientes',null,'?select=*&order=empresa.asc'),
        sb('GET','oportunidades',null,'?select=*'),
        sb('GET','alertas',null,'?select=*'),
        sb('GET','partes',null,'?select=*'),
      ]);
      if(cv&&cv.length)V=cv;
      if(cc&&cc.length)C=cc;
      if(co&&co.length)O=co;
      if(ca&&ca.length)AL=ca;
      if(cp&&cp.length){ PA={}; cp.forEach(p=>{ PA[p.fecha]={obj:p.obj||'',log:p.log||'',dif:p.dif||'',prox:p.prox||'',mood:p.mood||'',tareas:p.tareas||[]}; }); }
      saveLocal(); setSB('ok'); badges(); render();
    } catch(e) {
      setSB('off');
      console.warn('Cloud load:', e.message);
    }
  }, 100);
}

// ── PARTE ──
function getP(f) { if(!PA[f]) PA[f]={obj:'',log:'',dif:'',prox:'',mood:'',tareas:[]}; return PA[f]; }
function rParte(c) {
  const p=getP(parteDate);
  const dV=V.filter(v=>v.fecha===parteDate).sort((a,b)=>a.hora.localeCompare(b.hora));
  const tl=dV.length?dV.map(v=>{
    const cols={Completada:'var(--gr)',Pendiente:'var(--am)','En curso':'var(--ax)',Cancelada:'var(--re)'};
    return `<div class="tl-i">
      <div class="tl-dot" style="border-color:${cols[v.estado]||'var(--bd2)'}">
        ${v.estado==='Completada'?'✓':v.estado==='En curso'?'▶':'○'}
      </div>
      <div class="tl-tx">
        <div class="tl-nm">${v.hora} — ${v.cliente}</div>
        <div class="tl-mt">${v.contacto||''} · <span class="badge ${ECLS[v.estado]||'b-gy'}" style="font-size:10px">${v.estado}</span></div>
      </div>
    </div>`;
  }).join(''):`<div style="font-size:12px;color:var(--t3);font-style:italic;padding:6px 0">Sin visitas para esta fecha</div>`;

  const tareas=(p.tareas||[]).map((t,i)=>`<div class="tarea ${t.done?'done':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleT(${i})" style="width:14px;height:14px;accent-color:var(--am);cursor:pointer;flex-shrink:0"/>
    <span class="tx">${t.text}</span>
    <button class="tdel" onclick="delT(${i})">×</button>
  </div>`).join('');

  c.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div style="font-size:16px;font-weight:700">Parte diario</div>
    <input type="date" value="${parteDate}" onchange="parteDate=this.value;rParte(document.getElementById('cnt'))" style="height:28px;padding:0 9px;border:1px solid var(--bd);border-radius:var(--r);font-family:inherit;font-size:13px;outline:none"/>
    <span style="font-size:13px;color:var(--t2)">${fmtD(parteDate)}</span>
    <button class="btn btn-sm" onclick="pdfParte()" style="margin-left:auto">🖨️ PDF</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="sv">${dV.length}</div><div class="sl">Visitas</div></div>
    <div class="stat"><div class="sv" style="color:var(--gr)">${dV.filter(v=>v.estado==='Completada').length}</div><div class="sl">OK</div></div>
    <div class="stat"><div class="sv" style="color:var(--am)">${dV.filter(v=>v.estado==='Pendiente').length}</div><div class="sl">Pendiente</div></div>
    <div class="stat"><div class="sv" style="color:var(--ax)">${O.filter(o=>o.fecha===parteDate).length}</div><div class="sl">Opps</div></div>
  </div>
  <div class="pg2">
    <div>
      <div class="pcard"><div class="pcard-t">📅 Visitas</div><div>${tl}</div></div>
      <div class="pcard" style="margin-top:10px"><div class="pcard-t">✅ Tareas</div>
        <div style="margin-bottom:8px">${tareas||'<div style="font-size:12px;color:var(--t3);font-style:italic">Sin tareas aún</div>'}</div>
        <div class="tadd"><input id="tInp" placeholder="Nueva tarea..." onkeydown="if(event.key==='Enter')addT()"/><button class="btn btn-sm btn-am" onclick="addT()">＋</button></div>
      </div>
    </div>
    <div class="pcard">
      <div class="pcard-t">📝 Resumen</div>
      <div class="pf"><label>Objetivo</label><textarea oninput="saveP('obj',this.value)" placeholder="Objetivo del día...">${p.obj||''}</textarea></div>
      <div class="pf"><label>Logros</label><textarea oninput="saveP('log',this.value)" placeholder="Resultados conseguidos...">${p.log||''}</textarea></div>
      <div class="pf"><label>Dificultades</label><textarea oninput="saveP('dif',this.value)" placeholder="Obstáculos encontrados...">${p.dif||''}</textarea></div>
      <div class="pf"><label>Próximos pasos</label><textarea oninput="saveP('prox',this.value)" placeholder="Acciones para mañana...">${p.prox||''}</textarea></div>
      <div class="pf"><label>Estado de ánimo</label>
        <div class="mood">${[['😞','malo'],['😐','regular'],['🙂','bueno'],['😄','excelente'],['🔥','en racha']].map(([em,v])=>`<button class="${p.mood===v?'on':''}" onclick="saveP('mood','${v}');rParte(document.getElementById('cnt'))">${em}</button>`).join('')}</div>
      </div>
    </div>
  </div>`;

function saveP(k,v) { getP(parteDate)[k]=v; save(); }
function addT() { const inp=document.getElementById('tInp'); const t=inp?.value.trim(); if(!t)return; getP(parteDate).tareas.push({text:t,done:false}); save(); rParte(document.getElementById('cnt')); }
function toggleT(i) { const p=getP(parteDate); p.tareas[i].done=!p.tareas[i].done; save(); rParte(document.getElementById('cnt')); }
function delT(i) { const p=getP(parteDate); p.tareas.splice(i,1); save(); rParte(document.getElementById('cnt')); }

function rAlertas(c) {
  const cols={llamada:'#3b82f6',email:'#16a34a',reunion:'#7c3aed',tarea:'#f59e0b',personalizada:'#0891b2'};
  const icos={llamada:'📞',email:'✉️',reunion:'🤝',tarea:'📋',personalizada:'⭐'};
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div style="font-size:16px;font-weight:700">Alertas <span style="font-size:13px;color:var(--t3);font-weight:400">${AL.filter(a=>a.activa).length} activas</span></div>
    <button class="add" onclick="openA(null)">＋ Alerta</button>
  </div>`;
  if(!AL.length) h+=`<div class="empty"><div class="eic">🔔</div><p>Sin alertas</p></div>`;
  else [...AL.filter(a=>a.activa).sort((a,b)=>a.fecha.localeCompare(b.fecha)),...AL.filter(a=>!a.activa)].forEach(a=>{
    h+=`<div class="al ${a.activa?'':'done'}">
      <div class="aldot" style="background:${cols[a.tipo]||'#64748b'}"></div>
      <div class="al-info">
        <div class="al-msg">${icos[a.tipo]||'⭐'} ${a.msg}</div>
        <div class="al-sub">${a.cliente?'👤 '+a.cliente+' · ':''}📅 ${fmtD(a.fecha)}${a.hora?' · ⏰ '+a.hora:''}</div>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-sm ${a.activa?'btn-am':''}" onclick="toggleA('${a.id}')">${a.activa?'✓':'↩'}</button>
        <button class="btn btn-sm btn-re" onclick="delA('${a.id}')">🗑</button>
      </div>
    </div>`;
  });
  c.innerHTML=h;
}
function toggleA(id) { AL=AL.map(a=>a.id===id?{...a,activa:!a.activa}:a); save(); rAlertas(document.getElementById('cnt')); }
function delA(id) { if(!confirm('¿Eliminar?'))return; AL=AL.filter(a=>a.id!==id); save(); rAlertas(document.getElementById('cnt')); }

// ── GLOBAL SEARCH ──
function openGS() {
  document.getElementById('gsOv').classList.add('on');
  setTimeout(()=>document.getElementById('gsInp')?.focus(),80);
}
function closeGS() { document.getElementById('gsOv').classList.remove('on'); document.getElementById('gsInp').value=''; document.getElementById('gsRes').innerHTML='<div class="gs-empty">Escribe para buscar...</div>'; }
let _gsT;
function doGS(q) {
  clearTimeout(_gsT);
  _gsT=setTimeout(()=>{
    const r=document.getElementById('gsRes');
    if(!q.trim()) { r.innerHTML='<div class="gs-empty">Escribe para buscar...</div>'; return; }
    const lq=q.toLowerCase();
    const fC=C.filter(c=>[c.empresa,c.contacto,c.nif||'',c.cups||'',c.sector||'',c.ciudad||''].some(x=>(x||'').toLowerCase().includes(lq)));
    const fV=V.filter(v=>[v.cliente,v.contacto||'',v.notas||''].some(x=>x.toLowerCase().includes(lq)));
    const fO=O.filter(o=>[o.cliente,o.tipo||'',o.notas||''].some(x=>x.toLowerCase().includes(lq)));
    let h='';
    if(!fC.length&&!fV.length&&!fO.length) { r.innerHTML='<div class="gs-empty">Sin resultados para "'+q+'"</div>'; return; }
    if(fC.length) {
      h+=`<div class="gs-section">👥 Clientes (${fC.length})</div>`;
      fC.slice(0,5).forEach(c=>{
        h+=`<div class="gs-item" onclick="closeGS();go('clientes',document.querySelectorAll('.nt')[2]);cDetail='${c.id}';render()">
          <span class="gi-ic">🏢</span>
          <div class="gi-main"><div class="gi-nm">${c.empresa}</div><div class="gi-sub">${c.contacto||''}${c.ciudad?' · '+c.ciudad:''}</div></div>
          <span class="badge ${CSCLS[c.estado]||'b-gy'}" style="font-size:10px">${CSLBL[c.estado]||c.estado}</span>
        </div>`;
      });
    }
    if(fV.length) {
      h+=`<div class="gs-section">📅 Visitas (${fV.length})</div>`;
      fV.slice(0,4).forEach(v=>{
        h+=`<div class="gs-item" onclick="closeGS();go('agenda',document.querySelectorAll('.nt')[0]);fDate=v.fecha;xId='${v.id}';render()">
          <span class="gi-ic">📋</span>
          <div class="gi-main"><div class="gi-nm">${v.cliente}</div><div class="gi-sub">${fmtD(v.fecha)} ${v.hora} · ${v.estado}</div></div>
        </div>`;
      });
    }
    if(fO.length) {
      h+=`<div class="gs-section">📊 Oportunidades (${fO.length})</div>`;
      fO.slice(0,4).forEach(o=>{
        h+=`<div class="gs-item" onclick="closeGS();go('pipeline',document.querySelectorAll('.nt')[1]);render()">
          <span class="gi-ic">💰</span>
          <div class="gi-main"><div class="gi-nm">${o.cliente} · ${fmtE(o.valor||0)}</div><div class="gi-sub">${o.etapa} · ${o.tipo||''}</div></div>
        </div>`;
      });
    }
    r.innerHTML=h;
  }, 200);
}

// ── EXPORT / IMPORT ──
function exportCSV() {
  const h='Empresa,NIF/CIF,Contacto,Cargo,Teléfono,Email,Sector,Ciudad,Estado,CUPS,Dirección,Compañía,Energía,Tarifa,kW,kWh,Importe €,Origen,Notas';
  const r=C.map(c=>[c.empresa,c.nif||'',c.contacto||'',c.cargo||'',c.telefono||'',c.email||'',c.sector||'',c.ciudad||'',c.estado,c.cups||'',c.direccion||'',c.compania||'',c.energia||'',c.tarifa||'',c.kw||0,c.kwh||0,c.importe||0,c.origen||'',c.notas||''].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+h+'\n'+r],{type:'text/csv;charset=utf-8;'}));a.download='lumina_clientes_'+TODAY+'.csv';a.click();
  toast('📊 CSV exportado');
}
function doImport(e) {
  const f=e.target.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=ev=>{
    try {
      const d=JSON.parse(ev.target.result);
      if(d.V)V=d.V; if(d.C)C=d.C; if(d.O)O=d.O; if(d.AL)AL=d.AL; if(d.PA)PA=d.PA;
      save(); render(); toast('✅ Datos importados');
    } catch(err) { toast('❌ Error: '+err.message); }
  };
  fr.readAsText(f); e.target.value='';
}
function exportJSON() {
  const d=JSON.stringify({V,C,O,AL,PA,ts:new Date().toISOString(),app:'Lumina CRM v3'},null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='lumina_backup_'+TODAY+'.json';a.click();
  toast('💾 Backup descargado');
}

    <button class="btn btn-am btn-sm" style="width:100%;margin-top:8px;height:34px" onclick="importManual()">Importar</button>
    <div id="mnRes"></div>
  `,null,null,true);
}
function importManual() {
  const raw=document.getElementById('mnInp')?.value.trim(); if(!raw)return;
  let added=0;
  raw.split('\n').filter(l=>l.trim()).forEach(line=>{
    const p=line.split('|').map(x=>x.trim()); const em=p[0]; if(!em)return;
    if(C.find(c=>c.empresa.toLowerCase()===em.toLowerCase()))return;
    C.push({id:uid(),empresa:em,nif:p[5]||'',contacto:p[1]||'',cargo:'',telefono:p[2]||'',email:p[3]||'',ciudad:p[4]||'',sector:'',estado:'nunca',origen:'Manual',cups:'',direccion:'',compania:'',energia:'',tarifa:'',kw:0,kwh:0,importe:0,notas:''});
    added++;
  });
  save();
  document.getElementById('mnRes').innerHTML=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:var(--r);padding:8px 11px;font-size:12px;color:var(--gr);margin-top:8px">✅ ${added} cliente${added!==1?'s':''} añadidos</div>`;
  if(added){ render(); setTimeout(()=>closeM(),1400); }
}

// ── MODALES ──
function showM(title,body,onOk,onDel,noBtn) {
  document.getElementById('__m')?.remove();
  document.body.insertAdjacentHTML('beforeend',`<div class="ov" id="__m" onclick="if(event.target.id==='__m')closeM()">
    <div class="modal">
      <div class="mhandle"></div>
      <div class="mh"><h3>${title}</h3><div class="mx" onclick="closeM()">✕</div></div>
      <div class="mb">${body}</div>
      ${!noBtn?`<div class="mf">
        ${onDel?`<button class="btn btn-sm btn-re" onclick="(${onDel.toString()})()" style="margin-right:auto">🗑️</button>`:''}
        <button class="btn btn-sm" onclick="closeM()">Cancelar</button>
        ${onOk?`<button class="btn btn-sm btn-am" onclick="(${onOk.toString()})()" >Guardar</button>`:''}
      </div>`:'<div class="mf"><button class="btn btn-sm" onclick="closeM()">Cerrar</button></div>'}
    </div>
  </div>`);
}
function closeM() { document.getElementById('__m')?.remove(); }

// ── PWA INSTALL ──
function doInstall() {
  if(window.__ip) {
    window.__ip.prompt();
    window.__ip.userChoice.then(r=>{
      window.__ip=null;
      if(r.outcome==='accepted') { document.getElementById('iBar').style.display='none'; toast('✅ Lumina CRM instalada'); }
    });
  }
}
function installApp() {
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid=/android/i.test(navigator.userAgent);
  if(window.__ip) { doInstall(); return; }
  let msg='';
  if(isIOS) msg='📱 Safari → 📤 Compartir → "Añadir a pantalla de inicio"';
  else if(isAndroid) msg='🤖 Chrome → ⋮ Menú → "Añadir a pantalla de inicio"';
  else msg='💻 Chrome/Edge → icono ⊕ en barra de direcciones';
  toast(msg);
}

  if(e.key==='Escape') { closeM(); closeGS(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='k') { e.preventDefault(); openGS(); }
});
